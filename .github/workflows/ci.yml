name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check main/

  test:
    name: Unit Tests (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pillow matplotlib
      - name: Run tests
        run: python -m unittest discover -v main/tests

  # Optional: test on Windows to match dev environment
  test-windows:
    name: Unit Tests (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pillow matplotlib
      - name: Run tests
        run: python -m unittest discover -v main/tests

  gui-smoke:
    name: Live Tk GUI (Windows Available Display, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GUI test dependencies
        timeout-minutes: 8
        run: |
          pip install numpy opencv-python-headless pillow matplotlib
      - name: Run live Tk workflow and capture layout screenshots
        timeout-minutes: 10
        env:
          PYRO_FOAMS_LIVE_TK: "1"
          PYRO_FOAMS_GUI_DISPLAY_MODE: available
          PYRO_FOAMS_GUI_ARTIFACTS: artifacts/gui-smoke
        run: python -m unittest -v main.tests.test_sample_project_gui
      - name: Upload GUI screenshots and display diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-live-tk-available-display
          path: |
            artifacts/gui-smoke/*.png
            artifacts/gui-smoke/*.json
          if-no-files-found: error

  gui-exact:
    name: Live Tk GUI (Linux Exact 1920x1200 Display, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install virtual display and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox scrot python3-tk x11-utils
          pip install numpy opencv-python-headless pillow matplotlib
      - name: Run all live Tk tests on the exact-size display
        timeout-minutes: 10
        env:
          PYRO_FOAMS_LIVE_TK: "1"
          PYRO_FOAMS_GUI_DISPLAY_MODE: exact
          PYRO_FOAMS_GUI_REQUIRE_WM: "1"
          PYRO_FOAMS_GUI_ARTIFACTS: artifacts/gui-exact
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24 -dpi 96" bash -c 'openbox > /tmp/pyro-openbox.log 2>&1 & python -m unittest -v main.tests.test_sample_project_gui'
      - name: Upload exact-size screenshots and display diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-live-tk-exact-display
          path: |
            artifacts/gui-exact/*.png
            artifacts/gui-exact/*.json
          if-no-files-found: error
